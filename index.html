<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Floricultura Bella Flor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f1410;
      --card-bg: rgba(255, 255, 255, 0.04);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent: #d4a373;
      --accent-hover: #e0b080;
      --text: #e8eae6;
      --text-muted: #9ba399;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .container { max-width: 480px; width: 100%; }
    .logo-area { margin-bottom: 32px; }
    .logo-area h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.2rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: #fff;
    }
    .logo-area p { color: var(--text-muted); font-size: 0.95rem; margin-top: 6px; }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 16px 20px;
      margin-bottom: 14px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      color: var(--text);
      text-decoration: none;
      font-weight: 500;
      font-size: 1rem;
      transition: all 0.2s ease;
    }
    .btn:hover {
      background: rgba(255,255,255,0.08);
      border-color: rgba(255,255,255,0.18);
      transform: translateY(-1px);
    }
    .btn-primary {
      background: var(--accent);
      color: #0f1410;
      border: none;
      font-weight: 600;
    }
    .btn-primary:hover {
      background: var(--accent-hover);
      color: #0f1410;
    }
    footer {
      margin-top: 40px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    footer a { color: var(--accent); text-decoration: none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-area">
      <h1>Floricultura Bella Flor</h1>
      <p>Flores frescas, arranjos e buquês para todos os momentos</p>
    </div>

    <a href="https://wa.me/5500000000000" class="btn btn-primary" target="_blank" rel="noopener">
      Fazer Pedido pelo WhatsApp
    </a>
    <a href="https://www.instagram.com/floricultura_bellaflor_ab/" class="btn" target="_blank" rel="noopener">
      Ver Nosso Instagram
    </a>
  </div>

  <footer>
    © Floricultura Bella Flor · <a href="https://www.instagram.com/floricultura_bellaflor_ab/" target="_blank" rel="noopener">@floricultura_bellaflor_ab</a>
    <div id="visit-count" style="margin-top:6px;opacity:.7"></div>
  </footer>

  <!-- Contador de Visitas (GoatCounter) -->
  <script data-goatcounter="https://SEUCODIGO.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
  <script>
    fetch('https://SEUCODIGO.goatcounter.com/counter/TOTAL.json')
      .then(r => r.json())
      .then(d => {
        document.getElementById('visit-count').textContent = 'Visitas: ' + d.count;
      })
      .catch(() => {});
  </script>
</body>
</html>
